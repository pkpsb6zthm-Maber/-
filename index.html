

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دليل الأماكن والمدن</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--primary);
    }

    /* شريط التحكم: اختيار المدينة والتصفية */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    select, button {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
      cursor: pointer;
      background: white;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* شبكة عرض الأماكن */
    .places-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      width: fit-content;
    }

    .badge-univ { background-color: #dbeafe; color: #1e40af; }
    .badge-rest { background-color: #fee2e2; color: #991b1b; }
    .badge-cafe { background-color: #fef3c7; color: #92400e; }

    .card h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
    }

    .card p {
      margin: 0 0 16px 0;
      color: #64748b;
      font-size: 14px;
    }

    .map-btn {
      display: inline-block;
      text-align: center;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 500;
    }

    .no-results {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>دليل الأماكن والمدن</h1>

    <!-- شريط الاختيار والتصفية -->
    <div class="controls">
      <div>
        <label for="citySelect"><strong>اختر المدينة:</strong> </label>
        <select id="citySelect" onchange="renderPlaces()">
          <option value="jeddah">جدة</option>
          <option value="riyadh">الرياض</option>
        </select>
      </div>

      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">الكل</button>
        <button class="filter-btn" onclick="setFilter('university', this)">جامعات</button>
        <button class="filter-btn" onclick="setFilter('restaurant', this)">مطاعم</button>
        <button class="filter-btn" onclick="setFilter('cafe', this)">كافيهات</button>
      </div>
    </div>

    <!-- كروت الأماكن -->
    <div id="placesGrid" class="places-grid"></div>
  </div>

  <script>
    // قاعدة البيانات لجميع الأماكن حسب المدينة
    const data = {
      jeddah: [
        // جامعات جدة
        {
          name: "جامعة الملك عبد العزيز",
          type: "university",
          categoryName: "جامعة",
          desc: "حي السليمانية، جدة",
          mapUrl: "https://maps.google.com/?q=King+Abdulaziz+University+Jeddah"
        },
        {
          name: "جامعة جدة",
          type: "university",
          categoryName: "جامعة",
          desc: "طريق عسفان، جدة",
          mapUrl: "https://maps.google.com/?q=University+of+Jeddah"
        },
        {
          name: "جامعة عفت",
          type: "university",
          categoryName: "جامعة",
          desc: "حي النزلة اليمانية، جدة",
          mapUrl: "https://maps.google.com/?q=Effat+University+Jeddah"
        },
        {
          name: "جامعة دار الحكمة",
          type: "university",
          categoryName: "جامعة",
          desc: "حي الفيحاء، جدة",
          mapUrl: "https://maps.google.com/?q=Dar+Al-Hekma+University+Jeddah"
        },

        // مطاعم جدة
        {
          name: "مطعم البيك",
          type: "restaurant",
          categoryName: "مطعم",
          desc: "فرع الخالدية، جدة",
          mapUrl: "https://maps.google.com/?q=ALBAIK+Jeddah"
        },
        {
          name: "مطعم خيال",
          type: "restaurant",
          categoryName: "مطعم",
          desc: "طريق الأمير سلطان، جدة",
          mapUrl: "https://maps.google.com/?q=Khayal+Restaurant+Jeddah"
        },
        {
          name: "مطعم الشرقية للمأكولات البحرية",
          type: "restaurant",
          categoryName: "مطعم",
          desc: "حي الحمراء، جدة",
          mapUrl: "https://maps.google.com/?q=Al+Sharqia+Seafood+Jeddah"
        },

        // كافيهات جدة
        {
          name: "برو جراوندز (Brew92)",
          type: "cafe",
          categoryName: "كافيه",
          desc: "شارع الخالدية، جدة",
          mapUrl: "https://maps.google.com/?q=Brew92+Jeddah"
        },
        {
          name: "برو كافيه (Boho Cafe)",
          type: "cafe",
          categoryName: "كافيه",
          desc: "حي المحمدية، جدة",
          mapUrl: "https://maps.google.com/?q=Boho+Cafe+Jeddah"
        },
        {
          name: "مد كافيه (MEDd Coffee)",
          type: "cafe",
          categoryName: "كافيه",
          desc: "حي الشاطئ، جدة",
          mapUrl: "https://maps.google.com/?q=MEDd+Coffee+Jeddah"
        }
      ],
      riyadh: [
        {
          name: "جامعة الملك سعود",
          type: "university",
          categoryName: "جامعة",
          desc: "الدرعية، الرياض",
          mapUrl: "https://maps.google.com/?q=King+Saud+University+Riyadh"
        },
        {
          name: "مطعم القرية النجديّة",
          type: "restaurant",
          categoryName: "مطعم",
          desc: "حي العليا، الرياض",
          mapUrl: "https://maps.google.com/?q=Najd+Village+Riyadh"
        },
        {
          name: "إل كافين كافيه (Elixir Bunn)",
          type: "cafe",
          categoryName: "كافيه",
          desc: "حي النخيل، الرياض",
          mapUrl: "https://maps.google.com/?q=Elixir+Bunn+Riyadh"
        }
      ]
    };

    let currentFilter = 'all';

    function setFilter(filterType, btn) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPlaces();
    }

    function renderPlaces() {
      const cityKey = document.getElementById('citySelect').value;
      const grid = document.getElementById('placesGrid');
      grid.innerHTML = '';

      const places = data[cityKey] || [];
      const filtered = currentFilter === 'all' 
        ? places 
        : places.filter(p => p.type === currentFilter);

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results">لا توجد أماكن مطابقة للبحث حالياً.</div>';
        return;
      }

      filtered.forEach(place => {
        let badgeClass = 'badge-univ';
        if (place.type === 'restaurant') badgeClass = 'badge-rest';
        if (place.type === 'cafe') badgeClass = 'badge-cafe';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <span class="badge ${badgeClass}">${place.categoryName}</span>
            <h3>${place.name}</h3>
            <p>${place.desc}</p>
          </div>
          <a href="${place.mapUrl}" target="_blank" class="map-btn">عرض الموقع على الخريطة 📍</a>
        `;
        grid.appendChild(card);
      });
    }

    // تشغيل العرض الابتدائي عند تحميل الصفحة
    renderPlaces();
  </script>
</body>
</html>
