<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --primary-blue: #0284c7;
      --header-bg: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      --bg-gray: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-gray);
      color: var(--text-main);
    }

    .header {
      background: var(--header-bg);
      color: white;
      text-align: center;
      padding: 35px 20px 45px;
      position: relative;
    }

    .badge-top {
      display: inline-block;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.4);
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .header p {
      margin: 0;
      font-size: 16px;
      opacity: .95;
      font-weight: 500;
    }

    .main-container {
      max-width: 1200px;
      margin: -25px auto 40px;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }

    .search-filter-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,.05);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .search-box-wrapper {
      position: relative;
      margin-bottom: 15px;
    }

    .search-input {
      width: 100%;
      padding: 14px 45px 14px 18px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 15px;
      outline: none;
      transition: all .2s;
    }

    .search-input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(2,132,199,.15);
    }

    .search-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #94a3b8;
    }

    .categories-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: center;
    }

    .cat-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: #f1f5f9;
      color: #475569;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all .2s;
    }

    .cat-btn:hover {
      background: #e2e8f0;
    }

    .cat-btn.active {
      background: #0284c7;
      color: white;
      border-color: #0284c7;
    }

    .city-select {
      margin-right: auto;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-weight: 700;
      color: #334155;
      outline: none;
      cursor: pointer;
      max-width: 100%;
    }

    .content-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .content-layout {
        grid-template-columns: 1fr;
      }

      .map-container {
        position: relative !important;
        top: auto !important;
        height: 360px !important;
      }

      .header h1 {
        font-size: 32px;
      }
    }

    .map-container {
      background: white;
      border-radius: 16px;
      height: 520px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.03);
      position: sticky;
      top: 20px;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .results-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .place-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,.02);
      transition: all .2s;
      cursor: pointer;
    }

    .place-card:hover {
      border-color: var(--primary-blue);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
    }

    .place-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }

    .place-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }

    .place-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .tags-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-item {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .tag-elevator {
      background-color: #dcfce7;
      color: #15803d;
    }

    .tag-parking {
      background-color: #dbeafe;
      color: #1d4ed8;
    }

    .tag-ramp {
      background-color: #fef3c7;
      color: #b45309;
    }

    .tag-unverified {
      background-color: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
    }

    .place-link {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 12px;
      border-radius: 8px;
      background: #e0f2fe;
      color: #075985;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .no-data {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 14px;
      color: #64748b;
      font-weight: 700;
      border: 1px solid var(--border-color);
    }

    .verification-note {
      font-size: 12px;
      color: #64748b;
      line-height: 1.7;
      margin-top: 18px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 10px;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      padding: 20px;
    }
  </style>
</head>

          oninput="filterData()"

      </div>

      <div class="categories-list">
        <button class="cat-btn active" onclick="setCategory('all', this)">جميع الأماكن</button>
        <button class="cat-btn" onclick="setCategory('hospital', this)">🏥 مستشفيات</button>
        <button class="cat-btn" onclick="setCategory('university', this)">🎓 جامعات</button>
        <button class="cat-btn" onclick="setCategory('gov', this)">🏛️ دوائر حكومية</button>

        <button class="cat-btn" onclick="setCategory('cafe', this)">☕ كافيهات</button>
        <button class="cat-btn" onclick="setCategory('mall', this)">🛍️ مراكز تجارية</button>

        <select id="citySelect" class="city-select" onchange="filterData()">

          <option value="جدة" selected>جدة</option>
          <option value="الرياض">الرياض</option>

          <option value="المدينة">المدينة المنورة</option>

          <option value="أبها">أبها</option>
          <option value="القصيم">القصيم</option>
          <option value="حائل">حائل</option>
        </select>
      </div>
    </div>
    <div class="content-layout">
      <div class="map-container">
        <div id="map"></div>
      </div>

      <div class="results-container">
        <div id="resultsCount" class="results-count">عدد النتائج المعروضة: 0</div>
        <div id="placesList"></div>
        <div class="verification-note">

          يرجى التأكد من تفاصيل التسهيلات قبل الزيارة.
        </div>
      </div>
    </div>

    let selectedCategory = "all";
    let map;
    let markersGroup;

    // تحويل اسم الفئة إلى رمز مناسب
    function getCategoryIcon(category) {
      const icons = {
        hospital: "🏥",
        university: "🎓",
        gov: "🏛️",
        restaurant: "🍽️",
        cafe: "☕",
        mall: "🛍️"
      };

      return icons[category] || "📍";
    }

    // اختيار فئة الأماكن
    function setCategory(category, button) {
      selectedCategory = category;

      document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
      filterData();
    }

    // تهيئة الخريطة
    function initMap() {
      map = L.map("map").setView([21.5433, 39.1728], 11);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);

      filterData();

      // معالجة مشكلة حجم الخريطة عند عرض الصفحة
      setTimeout(() => {
        map.invalidateSize();
      }, 300);
    }

    // البحث والتصفية حسب المدينة والفئة
    function filterData() {
      const searchElement = document.getElementById("searchInput");
      const cityElement = document.getElementById("citySelect");

      if (!searchElement || !cityElement) return;

      const searchValue = searchElement.value.trim().toLowerCase();
      const cityValue = cityElement.value;

      const filtered = placesData.filter(item => {
        const matchesCategory =
          selectedCategory === "all" ||
          item.category === selectedCategory;

        const matchesCity =
          cityValue === "all" ||
          item.city === cityValue;

        const searchableText = [
          item.name,
          item.city,
          item.catName
        ].join(" ").toLowerCase();

        const matchesSearch = searchableText.includes(searchValue);

        return matchesCategory && matchesCity && matchesSearch;
      });

      renderResults(filtered);
      updateMapMarkers(filtered);
    }

    // تحديد لون ووسم التسهيلات
    function getFacilityClass(facility) {
      if (facility.includes("غير متحقق")) {
        return "tag-unverified";
      }

      if (facility.includes("مصعد") || facility.includes("دورة")) {
        return "tag-elevator";
      }

      if (facility.includes("موقف")) {
        return "tag-parking";
      }

      return "tag-ramp";
    }

    // عرض بطاقات الأماكن
    function renderResults(list) {
      const listContainer = document.getElementById("placesList");
      const countContainer = document.getElementById("resultsCount");

      countContainer.textContent = `عدد النتائج المعروضة: ${list.length}`;
      listContainer.innerHTML = "";

      if (list.length === 0) {
        listContainer.innerHTML =
          '<div class="no-data">لم يتم العثور على أماكن مطابقة للبحث. جربي تغيير المدينة أو الفئة.</div>';
        return;
      }

      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "place-card";
        card.setAttribute("tabindex", "0");
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `عرض ${item.name} على الخريطة`);

        const header = document.createElement("div");
        header.className = "place-header";

        const title = document.createElement("h3");
        title.className = "place-title";
        title.textContent = `${getCategoryIcon(item.category)} ${item.name}`;

        header.appendChild(title);

        const subtitle = document.createElement("div");
        subtitle.className = "place-subtitle";
        subtitle.textContent = `📍 ${item.city} • ${item.catName}`;

        const tags = document.createElement("div");
        tags.className = "tags-list";

        item.facilities.forEach(facility => {
          const tag = document.createElement("span");
          tag.className = `tag-item ${getFacilityClass(facility)}`;

          if (facility.includes("غير متحقق")) {
            tag.textContent = "⚠️ " + facility;
          } else {
            tag.textContent = "♿ " + facility;
          }

          tags.appendChild(tag);
        });

        const mapLink = document.createElement("a");
        mapLink.className = "place-link";
        mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + " " + item.city + " السعودية")}`;
        mapLink.target = "_blank";
        mapLink.rel = "noopener noreferrer";
        mapLink.textContent = "عرض الموقع على خرائط Google";

        mapLink.addEventListener("click", event => {
          event.stopPropagation();
        });

        card.appendChild(header);
        card.appendChild(subtitle);
        card.appendChild(tags);
        card.appendChild(mapLink);

        card.addEventListener("click", () => {
          focusOnMap(item.lat, item.lng, item.name);
        });

        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            focusOnMap(item.lat, item.lng, item.name);
          }
        });

        listContainer.appendChild(card);
      });
    }

    // تحديث علامات الخريطة حسب نتائج البحث
    function updateMapMarkers(list) {
      if (!map || !markersGroup) return;

      markersGroup.clearLayers();

      if (list.length === 0) return;

      const bounds = [];

      list.forEach(item => {
        const marker = L.marker([item.lat, item.lng]);

        const popupContent = document.createElement("div");
        const name = document.createElement("strong");
        name.textContent = item.name;

        const city = document.createElement("div");
        city.textContent = `${item.city} — ${item.catName}`;

        const note = document.createElement("div");
        note.textContent = item.facilities.some(f =>
          f.includes("غير متحقق")
        )
          ? "التسهيلات غير متحقق منها بعد"
          : "بيانات التسهيلات المسجلة تحتاج إلى التحقق من مصدرها";

        popupContent.appendChild(name);
        popupContent.appendChild(city);
        popupContent.appendChild(note);

        marker.bindPopup(popupContent);
        markersGroup.addLayer(marker);

        bounds.push([item.lat, item.lng]);
      });

      if (bounds.length === 1) {
        map.setView(bounds[0], 14);
      } else if (bounds.length > 1) {
        map.fitBounds(bounds, {
          padding: [30, 30],
          maxZoom: 13
        });
      }
    }

    // الانتقال إلى مكان على الخريطة
    function focusOnMap(lat, lng, name) {
      if (!map) return;

      map.setView([lat, lng], 15);

      L.popup()
        .setLatLng([lat, lng])
        .setContent(
          `<strong>${String(name)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")}</strong>`
        )
        .openOn(map);

      if (window.innerWidth <= 900) {
        document.querySelector(".map-container").scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }

    // تشغيل المنصة بعد تحميل الصفحة
    window.addEventListener("load", initMap);
  </script>
